<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background: #051329;
  color: #ffffff;
  line-height: 1.7;
}

/* Header */
header {
  background: #051329;
  color: #ffffff;
  padding: 20px 5%;
  text-align: center;
  border-bottom: 1px solid #18395f;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 12px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
  margin-top: 5px;
}

nav a {
  color: #ffffff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: color 0.3s;
}

nav a:hover {
  color: #7dd3fc;
}

/* Hero */
.hero {
  background: linear-gradient(
    180deg,
    #051329 0%,
    #0a2540 50%,
    #071b35 100%
  );
  color: #ffffff;
  padding: 40px 6%;
  display: flex;
  align-items: flex-start;
  gap: 35px;
  flex-wrap: wrap;
  min-height: 380px;
}

.hero-left-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  flex-shrink: 0;
}

.profile {
  width: 140px;
  height: 140px;
  object-fit: cover;
  object-position: center;
  border-radius: 14px;
  border: 4px solid #ffffff;
  background: #dceeff;
}

.button {
  display: inline-block;
  background: #7dd3fc;
  color: #051329;
  text-decoration: none;
  padding: 9px 16px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  text-align: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  transition: background 0.3s, transform 0.3s;
  cursor: pointer;
}

.button:hover {
  background: #38bdf8;
  transform: translateY(-2px);
}

.hero-left-column .button {
  width: 100%;
}

.hero-right-content {
  flex: 1;
  min-width: 280px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: 15px;
}

.hero-right-content h2 {
  font-size: clamp(20px, 3.2vw, 26px);
  color: #ffffff;
  margin-bottom: 2px;
}

.name-line {
  width: 100%;
  max-width: 450px;
  height: 2px;
  background: #31588c;
  margin-bottom: 4px;
}

.welcome-text {
  font-size: 15px;
  color: #d1d5db;
}

.contact-section-title {
  font-size: 14px;
  font-weight: bold;
  color: #ffffff;
  margin-top: 4px;
}

.contact-mini {
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-wrap: anywhere;
  color: #e2e8f0;
}

.contact-mini a {
  color: #93c5fd;
  text-decoration: none;
}

.contact-mini a:hover {
  color: #7dd3fc;
  text-decoration: underline;
}

/* Main content */
main {
  max-width: 1200px;
  margin: auto;
  padding: 35px 16px;
}

/* All main sections */
section {
  background: #ffffff;
  color: #172033;
  padding: 25px;
  margin: 22px 0;
  border-radius: 14px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.15);
  scroll-margin-top: 20px;
}

section h2 {
  color: #104a76;
  margin-bottom: 12px;
  font-size: 24px;
  border-bottom: 2px solid #dbeafe;
  padding-bottom: 8px;
}

/* Education and other cards */
.card {
  border-left: 4px solid #7a28b8;
  padding: 16px;
  margin-top: 15px;
  margin-bottom: 15px;
  background: #f5f9fd;
  color: #172033;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  overflow-wrap: anywhere;
}

.card h3 {
  color: #104a76;
  margin-bottom: 10px;
}

.card p {
  margin-bottom: 5px;
}

.card ul {
  padding-left: 22px;
  margin: 8px 0;
}

.card li {
  margin-bottom: 3px;
}

/* Gallery and family links */
.lovestory-link,
.family-link {
  color: #075b91;
  font-weight: bold;
  overflow-wrap: anywhere;
}

a {
  transition: color 0.2s;
}

/* Photos */
.card img {
  max-width: 100%;
  transition: transform 0.2s;
}

.card img:hover {
  transform: scale(1.03);
}

/* Image preview modal */
#imgModal {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.88);
  justify-content: center;
  align-items: center;
  padding: 15px;
}

#modalImage {
  max-width: 95%;
  max-height: 90%;
  object-fit: contain;
  border: 3px solid #ffffff;
  border-radius: 8px;
}

/* Footer */
footer {
  text-align: center;
  background: #051329;
  color: #ffffff;
  padding: 30px 15px;
  margin-top: 25px;
  line-height: 1.8;
  border-top: 1px solid #18395f;
}

/* Mobile responsive */
@media (max-width: 768px) {
  header {
    padding: 15px;
  }

  nav {
    gap: 10px;
  }

  nav a {
    font-size: 13px;
  }

  .hero {
    padding: 25px 15px;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .hero-left-column {
    width: 150px;
  }

  .hero-right-content {
    padding-left: 0;
    width: 100%;
    min-width: 0;
    align-items: center;
  }

  .name-line {
    max-width: 100%;
  }

  section {
    padding: 18px;
    margin: 18px 0;
  }

  section h2 {
    font-size: 22px;
  }

  .card {
    padding: 12px;
  }
}
  </style>
